name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: npm run check:server

      - name: Server health smoke test
        run: |
          node server/index.js &
          SERVER_PID=$!
          sleep 1
          curl --fail --silent http://127.0.0.1:3001/api/health
          kill $SERVER_PID

      - name: Build frontend
        run: npm run build
